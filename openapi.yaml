        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteUserApiKeysId
      tags: [UserPanel]
      summary: 删自己的密钥
      x-implemented: local
      security:
        - bearerSession: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 已删
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /user/billing_records:
    get:
      operationId: getUserBillingRecords
      tags: [UserPanel]
      summary: 我的账单
      x-implemented: local
      security:
        - bearerSession: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: model
          in: query
          schema: { type: string }
        - name: request_id
          in: query
          schema: { type: string }
          description: 模糊匹配
        - name: status
          in: query
          schema: { type: string, enum: [success, error] }
        - name: charge
          in: query
          schema: { type: string, enum: [free, paid] }
          description: 其他取值忽略
      responses:
        "200":
          description: |
            一页账单，每项多带 quota_paid 与 balance_paid。

            **与线上的一处有意差异（改名，不是新增字段）**：线上这两个字段叫
            `credit_paid` 与 `balance_paid`，本机把 `credit_paid` 改名成了 `quota_paid`
            —— 它装的一直是订阅额度付掉的部分，线上那个名字与口袋对不上。
            值一个字没动，只是同一个口袋换了个名字。**拿这份文档对线上时，线上回的仍是
            `credit_paid`**；线上若也要改名，得等它的源码先改。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/BillingRecord"
                            - type: object
                              properties:
                                quota_paid: { type: number, description: "用订阅额度付掉的部分。本机改名，线上仍叫 credit_paid" }
                                balance_paid: { type: number, description: 用余额付掉的部分 }

  /user/request_records:
    get:
      operationId: getUserRequestRecords
