      security:
        - bearerSession: []
        - apiKey: []
      responses:
        "200":
          description: 可选筛选项
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          models: { type: array, items: { type: string } }
                          user_agents: { type: array, items: { type: string } }

