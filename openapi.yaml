  /api/admin/notifications:
    get:
      tags: [System]
      summary: 通知投递记录
      description: |
        查询参数 page、size、user_id、type。

        **只有本机有，线上没有这个端点。**
      operationId: getApiAdminNotifications
      x-implemented: local-only
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: user_id
          in: query
          schema: { type: integer, format: int64 }
        - name: type
          in: query
          schema: { type: string }
      responses:
        "200":
          description: 投递记录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Notification" }
        "403":
          description: 不是管理员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalErrorEnvelope" }
    post:
      tags: [System]
      summary: 发通知
      description: |
        给一个或多个用户发。`user_id` 发单个，`user_ids` 发批量，两者至少给一个。

        带 `idempotency_key` 时按它去重：同一个业务事件重复投递只落一条
        （「余额不足」这种每天都会触发的事件靠它避免刷屏）。批量发时服务端会在键后面
        接上用户 id，否则所有人共用一个键、只有第一个收得到。

        **只有本机有，线上没有这个端点。**
      operationId: postApiAdminNotifications
      x-implemented: local-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                user_id: { type: integer, format: int64 }
                user_ids: { type: array, items: { type: integer, format: int64 } }
                type: { type: string, maxLength: 64 }
                title: { type: string, maxLength: 255 }
                body: { type: [string, "null"] }
                severity: { type: string, enum: [info, warning, urgent], default: info }
                action_label: { type: string, maxLength: 128 }
                action_url: { type: string, maxLength: 512 }
                metadata: { type: [object, "null"] }
                expires_at: { type: [string, "null"], format: date-time }
                idempotency_key: { type: string, maxLength: 120 }
      responses:
        "201":
          description: 已投递
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  created: { type: integer, description: 目标用户数 }
        "400":
          description: 参数不合法，或没给 user_id / user_ids
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalErrorEnvelope" }
        "403":
          description: 不是管理员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalErrorEnvelope" }
        "404":
          description: 有用户在库里找不到，响应里会列出是哪几个
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalErrorEnvelope" }
