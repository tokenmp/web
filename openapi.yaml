      responses:
        "200":
          description: 签发成功，key 是明文，只此一次
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: integer, format: int64 }
                          name: { type: string }
                          key: { type: string }
                          key_prefix: { type: string }
                          expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }

