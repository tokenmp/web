                        items: { $ref: "#/components/schemas/ShareAccountRow" }

  /admin/share-accounts/{id}/review:
    post:
      operationId: postAdminShareAccountsIdReview
      tags: [Settings]
      summary: 审核共享账号
      x-implemented: remote
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean, description: true 上架，false 回私有 }
      responses:
        "200":
          description: 审核后的账号
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ChannelAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/GatewaySyncFailed" }

  /admin/share-accounts/{id}/probe:
    post:
      operationId: postAdminShareAccountsIdProbe
      tags: [Settings]
