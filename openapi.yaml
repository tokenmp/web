      responses:
        "200":
          description: 一页调用记录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/RequestRecord" }

  /user/request_records/filters:
