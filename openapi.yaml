      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 探测结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          account: { $ref: "#/components/schemas/ChannelAccount" }
                          models: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: 上游报错，或下发网关失败
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /user/api_keys:
