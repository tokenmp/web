  /user/usage:
    get:
      operationId: getUserUsage
      tags: [UserPanel]
      summary: 我的用量趋势
      x-implemented: local
      security:
        - bearerSession: []
        - apiKey: []
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "200":
          description: 按天的序列
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          series:
                            type: array
                            items: { $ref: "#/components/schemas/UsageSeriesItem" }
        "400":
          description: days 不在 1 到 90 之间（code 为 invalid_days）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /user/channel-applications/upstream-models:
    post:
      operationId: postUserChannelApplicationsUpstreamModels
      tags: [UserPanel]
      summary: 提交申请前先探一下上游模型
      description: 凭据只用于这次探测，不落库也不回显
      x-implemented: remote
      security:
        - bearerSession: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, base_url, api_key]
              properties:
                type: { type: string, enum: [openai, anthropic] }
                base_url: { type: string }
                api_key: { type: string }
      responses:
        "200":
          description: 上游模型清单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          models: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502":
          description: 上游报错
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /user/channel-applications:
    get:
      operationId: getUserChannelApplications
      tags: [UserPanel]
      summary: 我提交的申请
      x-implemented: remote
      security:
        - bearerSession: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
          description: 其他取值忽略
      responses:
        "200":
          description: 一页申请
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ChannelApplication" }
    post:
      operationId: postUserChannelApplications
      tags: [UserPanel]
      summary: 提交渠道开通申请
      x-implemented: remote
      security:
        - bearerSession: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, base_url, api_key, models]
              properties:
                name: { type: string, maxLength: 64 }
                type: { type: string, enum: [openai, anthropic] }
                base_url: { type: string }
                api_key: { type: string, description: 渠道凭据，加密存储，不回显 }
                weight: { type: number, minimum: 0 }
                models: { type: array, minItems: 1, items: { type: string } }
                upstream_models:
                  type: object
                  additionalProperties: { type: string }
                supports: { type: array, items: { type: string } }
      responses:
        "201":
          description: 已提交
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          application: { $ref: "#/components/schemas/ChannelApplication" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /user/channel-applications/{id}:
    delete:
      operationId: deleteUserChannelApplicationsId
      tags: [UserPanel]
      summary: 撤回自己的申请
      x-implemented: remote
      security:
        - bearerSession: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 已撤回
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 已经通过的申请不能撤回（code 为 already_approved）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /user/account-groups:
    get:
      operationId: getUserAccountGroups
      tags: [UserPanel]
      summary: 我能看到的渠道组
      x-implemented: remote
      security:
        - bearerSession: []
        - apiKey: []
      responses:
        "200":
          description: 渠道组列表，每项多带 owned_by_me 与 account_count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/ChannelGroup"
                            - type: object
                              properties:
                                owned_by_me: { type: boolean }
                                account_count: { type: integer }

  /user/channel-groups/{id}:
    put:
      operationId: putUserChannelGroupsId
      tags: [UserPanel]
      summary: 改我自己的渠道组
      description: 只能改自己属主的分享组
      x-implemented: remote
      security:
        - bearerSession: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, base_url, models]
              properties:
                type: { type: string, enum: [openai, anthropic] }
                base_url: { type: string }
                models: { type: array, minItems: 1, items: { type: string } }
                upstream_models:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "200":
          description: 改后的渠道组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ChannelGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/GatewaySyncFailed" }

  /user/accounts:
    get:
      operationId: getUserAccounts
      tags: [UserPanel]
      summary: 我分享的账号
      x-implemented: remote
      security:
        - bearerSession: []
        - apiKey: []
      responses:
        "200":
          description: 账号列表，每项多带 group_name
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/ChannelAccount"
                            - type: object
                              properties:
                                group_name: { type: string }
    post:
      operationId: postUserAccounts
      tags: [UserPanel]
      summary: 分享一个上游账号
      description: api_key 加密存储，任何响应都不回显
      x-implemented: remote
      security:
        - bearerSession: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id, name, api_key]
              properties:
                group_id: { type: integer, format: int64 }
                name: { type: string, maxLength: 64 }
                api_key: { type: string }
      responses:
        "201":
          description: 已提交
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          account: { $ref: "#/components/schemas/ChannelAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 账号名重复（code 为 duplicate_account）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "502": { $ref: "#/components/responses/GatewaySyncFailed" }

  /user/accounts/{id}/usage:
    get:
      operationId: getUserAccountsIdUsage
      tags: [UserPanel]
      summary: 我的账号被用掉多少
      description: 非属主访问按 not_found 处理
      x-implemented: remote
      security:
        - bearerSession: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 用量汇总与明细
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          account_id: { type: integer, format: int64 }
                          account_name: { type: string }
                          channel_name: { type: string }
                          total: { type: integer, format: int64 }
                          requests: { type: integer }
                          credit: { type: number }
                          records:
                            type: array
                            items:
                              type: object
                              properties:
                                request_id: { type: string }
                                model: { type: string }
                                status: { type: string }
                                prompt_tokens: { type: integer, format: int64 }
                                completion_tokens: { type: integer, format: int64 }
                                revenue_amount: { type: number }
                                owner_credit_amount: { type: number }
                                self_owned: { type: boolean }
                                created_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /user/accounts/{id}:
    patch:
      operationId: patchUserAccountsId
      tags: [UserPanel]
      summary: 改分享账号的可见性
      x-implemented: remote
      security:
        - bearerSession: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public]
              properties:
                public: { type: boolean, description: true 会进入待审核状态 }
      responses:
        "200":
          description: 改后的账号
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ChannelAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteUserAccountsId
      tags: [UserPanel]
      summary: 收回分享的账号
      x-implemented: remote
      security:
        - bearerSession: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 已收回
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /user/accounts/{id}/share-probe:
    post:
      operationId: postUserAccountsIdShareProbe
      tags: [UserPanel]
      summary: 自助探测并上架
      description: 探测通过就直接上架。同一账号 60 秒内只能探一次
      x-implemented: remote
      security:
        - bearerSession: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                model: { type: string, maxLength: 128, description: 不填则探测上游 /models }
      responses:
        "200":
          description: 探测结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          account: { $ref: "#/components/schemas/ChannelAccount" }
                          models: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: 上游报错，或下发网关失败
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /user/catalog:
    get:
      operationId: getUserCatalog
      tags: [UserPanel]
      summary: 可用模型目录
      x-implemented: remote
      security:
        - bearerSession: []
        - apiKey: []
      responses:
        "200":
          description: 模型与它背后的渠道
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          updated_at: { type: string, format: date-time }
                          models:
                            type: array
                            items: { $ref: "#/components/schemas/CatalogModel" }

  /user/plans:
    get:
      operationId: getUserPlans
      tags: [UserPanel]
      summary: 可订阅的套餐
      x-implemented: local
      security:
        - bearerSession: []
        - apiKey: []
      responses:
        "200":
          description: 套餐列表与当前订阅
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          plans:
                            type: array
                            items: { $ref: "#/components/schemas/PanelPlan" }
                          current:
                            type: [object, "null"]
                            properties:
                              plan: { $ref: "#/components/schemas/PanelPlan" }
                              quota_limit: { type: number }
                              quota_used: { type: number }
                              period_start: { type: string, format: date-time }
                              period_end: { type: string, format: date-time }
                          default_plan_id: { type: integer, format: int64 }

  /user/plans/{id}/subscribe:
    post:
      operationId: postUserPlansIdSubscribe
      tags: [UserPanel]
      summary: 订阅套餐
      description: 没有请求体
      x-implemented: local
      security:
        - bearerSession: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 已订阅
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402":
          description: 余额不足（code 为 insufficient_balance）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /user/me:
    get:
      operationId: getUserMe
      tags: [UserPanel]
      summary: 我的账号信息
      x-implemented: local
      security:
        - bearerSession: []
        - apiKey: []
      responses:
        "200":
          description: 账号、余额与授信、预算
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PanelMe" }

  /user/auto-chain:
    get:
      operationId: getUserAutoChain
      tags: [UserPanel]
      summary: 我的自动降级链
      description: 没配过返回空数组，不是 404
      x-implemented: remote
      security:
        - bearerSession: []
        - apiKey: []
      responses:
        "200":
          description: 模型顺序
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          models: { type: array, items: { type: string } }
    put:
      operationId: putUserAutoChain
      tags: [UserPanel]
      summary: 改自动降级链
      description: 传空数组表示清除。返回去重保序后的结果
      x-implemented: remote
      security:
        - bearerSession: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                models: { type: array, items: { type: string } }
      responses:
        "200":
          description: 保存后的顺序
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          models: { type: array, items: { type: string } }
        "400":
          description: 模型不在可见目录里（code 为 invalid_request）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/system/version:
    get:
      tags: [System]
      summary: 系统版本号
      description: |
        公开，不需要登录。前端拿它在页脚显示版本号。

        **只有本机有，线上没有这个端点。**
      operationId: getApiSystemVersion
      security: []
      x-implemented: local-only
      responses:
        "200":
          description: 版本信息，没有配置时三个字段都是 null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }

  /api/announcements:
    get:
      tags: [System]
      summary: 当前生效的公告
      description: |
        公开。只返回 status=published 且落在 publish_from / publish_until 窗口里的公告，
        按 sort_order 升序、新的在前。

        登录后每条会带 dismissed，表示当前用户关没关过。未登录时恒为 false。

        **只有本机有，线上没有这个端点。**
      operationId: getApiAnnouncements
      security: []
      x-implemented: local-only
      responses:
        "200":
          description: 公告列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Announcement" }

  /api/announcements/{id}/dismiss:
    post:
      tags: [System]
      summary: 关掉一条公告
      description: |
        记下当前用户关掉了这条公告，换设备也不会再弹。
        公告标了不可关闭时返回 400。

        **只有本机有，线上没有这个端点。**
      operationId: postApiAnnouncementsIdDismiss
      x-implemented: local-only
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 已记下
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkEnvelope" }
        "400":
          description: id 不合法，或这条公告不允许关闭
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalErrorEnvelope" }
        "401":
          description: 未登录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalErrorEnvelope" }
        "404":
          description: 公告不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalErrorEnvelope" }

  /api/notifications:
    get:
      tags: [System]
      summary: 我的通知
      operationId: getApiNotifications
      description: |
        当前用户的通知，新的在前，过期的不返回。
        查询参数 page、size、unread（unread=1 只看未读）。
        响应里带 unread 未读总数，前端不用再问一次。

        **只有本机有，线上没有这个端点。**
      x-implemented: local-only
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: unread
          in: query
          schema: { type: string, enum: ["1", "true", "yes"] }
          description: 只看未读
      responses:
        "200":
          description: 通知列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "401":
          description: 未登录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalErrorEnvelope" }

  /api/notifications/{id}/read:
    post:
      tags: [System]
      summary: 把一条通知标为已读
      description: |
        幂等，已经读过的再调一次也返回 ok。
        不属于当前用户的通知返回 404，不区分「不存在」和「不是你的」。

        **只有本机有，线上没有这个端点。**
      operationId: postApiNotificationsIdRead
      x-implemented: local-only
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 已读，带回 read_at
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  read_at: { type: string, format: date-time }
        "400":
          description: id 不合法
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalErrorEnvelope" }
        "404":
          description: 通知不存在或不属于当前用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalErrorEnvelope" }

  /api/notifications/read-all:
    post:
      tags: [System]
      summary: 全部标为已读
      description: |
        把当前用户所有未读通知标为已读，返回改了多少条。
        这条路径是静态段，不会被 /api/notifications/{id} 抢走。

        **只有本机有，线上没有这个端点。**
      operationId: postApiNotificationsReadAll
      x-implemented: local-only
      responses:
        "200":
          description: 已读
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  updated: { type: integer, description: 本次改动的条数 }
        "401":
          description: 未登录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalErrorEnvelope" }

  /api/admin/announcements:
    get:
      tags: [System]
      summary: 公告列表（含草稿与已归档）
      description: |
        管理端要能看见全部，所以不加 status 过滤时草稿也在。
        查询参数 page、size、status。

        响应比通用列表多一个 `status_counts`：各状态的全站条数，给管理页页头那四张卡用。
        它不随 `status` 变化 —— 切到「草稿」时，卡片仍要显示已发布有多少条。

        **只有本机有，线上没有这个端点。**
      operationId: getApiAdminAnnouncements
      x-implemented: local-only
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { type: string, enum: [draft, published, archived] }
      responses:
        "200":
          description: 公告列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Announcement" }
                      status_counts:
                        $ref: "#/components/schemas/AnnouncementStatusCounts"
        "403":
          description: 不是管理员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalErrorEnvelope" }
    post:
      tags: [System]
      summary: 新建公告
      description: |
        建出来的是草稿，发布是单独的动作，免得点一下保存就把公告推给全站。

        **只有本机有，线上没有这个端点。**
      operationId: postApiAdminAnnouncements
      x-implemented: local-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string, maxLength: 255 }
                body: { type: string }
                severity: { type: string, enum: [info, warning, urgent], default: info }
                scope: { type: string, default: all }
                dismissible: { type: boolean, default: true }
                sort_order: { type: integer, default: 0 }
                publish_from: { type: string, format: date-time, description: 不填即当前时间 }
                publish_until: { type: [string, "null"], format: date-time }
      responses:
        "201":
          description: 建好了（草稿）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Announcement" }
        "400":
          description: 参数不合法
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalErrorEnvelope" }
        "403":
          description: 不是管理员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalErrorEnvelope" }

