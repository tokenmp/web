      tags: [Models]
      summary: 立刻跑一次比价
      description: 对比自己的成本与参考价，返回差异清单
      x-implemented: remote
      responses:
        "200":
          description: 比价报告
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PriceCheckReport" }

  /admin/price-check/providers:
    get:
      operationId: getAdminPriceCheckProviders
      tags: [Models]
      summary: 参考价来源与厂商目录
      x-implemented: remote
      responses:
        "200":
          description: 可选来源与它们的厂商清单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ProviderCatalog" }

  /admin/price-check/reference:
    get:
      operationId: getAdminPriceCheckReference
      tags: [Models]
      summary: 拉某个厂商的参考价
      x-implemented: remote
      parameters:
        - name: source
          in: query
          required: true
          schema: { type: string, enum: [pydantic, models.dev] }
        - name: provider
          in: query
          required: true
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]*$" }
      responses:
        "200":
          description: 参考价列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          prices:
                            type: array
                            items: { $ref: "#/components/schemas/ModelPrice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502":
          description: |
            上游拉取失败。注意这个分支的信封与其他错误不一样：
            它同时带了 `data.prices`，且 `ok` 为 false
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: false }
                  error:
                    type: object
                    properties:
                      code: { type: string, const: ref_source_error }
                      message: { type: string }
                  data:
                    type: object
                    properties:
                      prices: { type: array, items: {} }

  /admin/channel-groups:
    get:
      operationId: getAdminChannelGroups
      tags: [Channels]
      summary: 渠道分组列表
      description: 不分页，一次返回全表；total 等于本次返回的条数
      x-implemented: remote
      responses:
        "200":
          description: 分组列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/ChannelGroup"
                            - type: object
                              properties:
                                account_count: { type: integer }
    post:
      operationId: postAdminChannelGroups
      tags: [Channels]
      summary: 新建渠道分组
      x-implemented: remote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelGroupRequest" }
      responses:
        "200":
          description: |
            建好了。`warning` 只在推给网关失败时出现。
            这个响应里的 `group.source` 是空的（没有填来源）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          group: { $ref: "#/components/schemas/ChannelGroup" }
                          warning: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: 分组名重复
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: duplicate_name, message: 分组名已存在 }

  /admin/channel-groups/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getAdminChannelGroupsId
      tags: [Channels]
      summary: 分组详情
      x-implemented: remote
      responses:
        "200":
          description: 分组与它名下的账号
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          group: { $ref: "#/components/schemas/ChannelGroup" }
                          accounts:
                            type: array
                            items: { $ref: "#/components/schemas/ChannelAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putAdminChannelGroupsId
      tags: [Channels]
      summary: 整体替换分组
      description: 请求体与新建相同。改前把 synced 置 0，改后重推该组全部账号
      x-implemented: remote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelGroupRequest" }
      responses:
        "200":
          description: 改后的分组与账号
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          group: { $ref: "#/components/schemas/ChannelGroup" }
                          accounts:
                            type: array
                            items: { $ref: "#/components/schemas/ChannelAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteAdminChannelGroupsId
      tags: [Channels]
      summary: 删分组
      description: 幂等，分组不存在也返回成功。删前会调网关把组内账号逐个删掉
      x-implemented: remote
      responses:
        "200":
          description: 已删
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/channel-groups/{id}/sync:
    post:
      operationId: postAdminChannelGroupsIdSync
      tags: [Channels]
      summary: 把分组同步给网关
      description: 注意这里 data 直接是分组对象，不像详情接口那样包一层 group
      x-implemented: remote
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 同步后的分组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ChannelGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/GatewaySyncFailed" }

  /admin/channel-groups/{id}/discover-models:
    post:
      operationId: postAdminChannelGroupsIdDiscoverModels
      tags: [Channels]
      summary: 探测上游支持哪些模型
      description: |
        拿组内第一个未停用账号的渠道凭据去调上游 GET /models，结果不落库。
        账号的渠道凭据只用于这次探测，不会回显。
      x-implemented: remote
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 上游模型与本地已有的对比
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          upstream: { type: array, items: { type: string } }
                          added: { type: array, items: { type: string } }
                          existing: { type: array, items: { type: string } }
        "400":
          description: id 非法，或组内没有可用账号（code 为 no_account）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: 上游报错
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: upstream_error, message: 上游返回异常 }

  /admin/channel-groups/{id}/discover-models/apply:
    post:
      operationId: postAdminChannelGroupsIdDiscoverModelsApply
      tags: [Channels]
      summary: 把探测到的模型合进分组
      description: 合并上游模型（保留现有顺序，新增的追加），回填上游自报的上下文参数，然后重推网关
      x-implemented: remote
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 已合并
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: 上游报错，或模型已保存但下发网关失败
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /admin/channel-groups/{id}/accounts:
    get:
      operationId: getAdminChannelGroupsIdAccounts
      tags: [Channels]
      summary: 分组下的账号
      description: 不校验分组是否存在，不存在时返回空数组
      x-implemented: remote
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 账号列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ChannelAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: postAdminChannelGroupsIdAccounts
      tags: [Channels]
      summary: 给分组添加账号
      description: |
        `api_key` 是纯写入字段，服务端加密后存起来，任何响应都不回显。
        新建账号的 share_state 恒为 private。
        下发网关失败时账号已入库并被置为停用，同时返回 502。
      x-implemented: remote
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, api_key]
              properties:
                name: { type: string, maxLength: 64, description: 组内唯一 }
                api_key: { type: string, description: 渠道凭据，明文提交，不回显 }
                weight: { type: number, minimum: 0 }
                cost_multiplier: { type: number, exclusiveMinimum: 0 }
      responses:
        "201":
          description: 建好了
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ChannelAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 组内账号名重复
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: duplicate_account, message: 账号名已存在 }
        "502": { $ref: "#/components/responses/GatewaySyncFailed" }

  /admin/channel-accounts/{id}:
    put:
      operationId: putAdminChannelAccountsId
      tags: [Channels]
      summary: 改账号
      description: |
        只认下面列出的键，其他键被忽略。空对象合法，等价于只刷 updated_at。
        `api_key` 传空串会被当成非法。
      x-implemented: remote
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key: { type: string, description: 非空才接受 }
                weight: { type: integer, minimum: 0 }
                cost_multiplier: { type: number, exclusiveMinimum: 0 }
                disabled: { type: boolean, description: true 会同时从网关删掉这个渠道 }
                public: { type: boolean, description: 平台直改，跳过审核 }
      responses:
        "200":
          description: 改好了
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/GatewaySyncFailed" }
    delete:
      operationId: deleteAdminChannelAccountsId
      tags: [Channels]
      summary: 删账号
      x-implemented: remote
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 已删（不存在也返回成功）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/channels-consistency:
    get:
      operationId: getAdminChannelsConsistency
      tags: [Channels]
      summary: 对账本地与网关的渠道
      description: 按名字逐个比，比对 base_url、是否停用与模型集合
      x-implemented: remote
      responses:
        "200":
          description: 差异清单。三个数组没内容时是 []
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          only_in_gateway:
                            type: array
                            items:
                              type: object
                              properties:
                                name: { type: string }
                                type: { type: string }
                                base_url: { type: string }
                          only_in_db:
                            type: array
                            items:
                              type: object
                              properties:
                                name: { type: string }
                                disabled: { type: integer }
                                base_url: { type: string }
                          config_mismatch:
                            type: array
                            items:
                              type: object
                              properties:
                                name: { type: string }
                                reason: { type: string }
                          consistent: { type: boolean }
        "502": { $ref: "#/components/responses/GatewayUnavailable" }
        "503": { $ref: "#/components/responses/GatewayUnavailable" }

  /admin/upstream-models:
    post:
      operationId: postAdminUpstreamModels
      tags: [Channels]
      summary: 拿一组凭据探上游模型
      description: 仅用于本次探测，不存库也不回显渠道凭据
      x-implemented: remote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, base_url, api_key]
              properties:
                type: { type: string, enum: [openai, anthropic] }
                base_url: { type: string }
                api_key: { type: string }
      responses:
        "200":
          description: 上游模型清单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          models: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502":
          description: 上游报错
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: upstream_error, message: 上游返回异常 }

  /admin/gateway/balancer:
    get:
      operationId: getAdminGatewayBalancer
      tags: [Gateway]
      summary: 读负载均衡配置
      description: 纯代理，不读写本地库，返回体来自网关
      x-implemented: remote
      responses:
        "200":
          description: 均衡策略
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/GatewayBalancer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/GatewayUnavailable" }
    put:
      operationId: putAdminGatewayBalancer
      tags: [Gateway]
      summary: 改负载均衡配置
      description: 请求体不解析，原样透传给网关，网关按键合并。空体或全空白返回 400，上限 1 MiB
      x-implemented: remote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 只传要改的字段即可
              properties:
                strategy: { type: string, enum: [weighted_random, softmax] }
                softmax:
                  type: object
                  properties:
                    temperature: { type: number }
                    metric: { type: string }
                degradation:
                  type: object
                  properties:
                    enabled: { type: boolean }
                    error_rate_threshold: { type: number }
                    weight_penalty: { type: number }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/GatewayUnavailable" }

  /admin/gateway/static-params:
    get:
      operationId: getAdminGatewayStaticParams
      tags: [Gateway]
      summary: 读网关静态参数
      x-implemented: remote
      responses:
        "200":
          description: 超时、重试、健康检查与粘性会话
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/GatewayStaticParams" }
        "503": { $ref: "#/components/responses/GatewayUnavailable" }

  /admin/gateway/config-patch:
    put:
      operationId: putAdminGatewayConfigPatch
      tags: [Gateway]
      summary: 改一个网关参数
      description: |
        后端先 GET 网关全量配置，改白名单里的一个字段，再整体 PUT 回去。
        时长参数要写成 300s 这样的字符串，整数参数传整数，开关传布尔。
      x-implemented: remote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, value]
              properties:
                path:
                  type: string
                  description: 白名单外的路径返回 unsupported_param
                  enum:
                    - timeout.non_stream_overall
                    - timeout.stream_first_byte
                    - timeout.stream_idle
                    - retry.channel_retries
                    - retry.cross_channel_retries
                    - retry.max_total_attempts
                    - health_check.failure_threshold
                    - health_check.failure_window
                    - health_check.cooldown_ttl
                    - health_check.cooldown_max
                    - sticky.enabled
                value:
                  description: 依 path 而定，时长传字符串、计数传整数、开关传布尔
      responses:
        "200":
          description: 刷新后的参数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/GatewayStaticParams" }
        "400":
          description: 路径不在白名单时 code 为 unsupported_param，取值不对时是 invalid_value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "502":
          description: 网关返回的配置解析不了
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503": { $ref: "#/components/responses/GatewayUnavailable" }

  /admin/gateway/reload:
    post:
      operationId: postAdminGatewayReload
      tags: [Gateway]
      summary: 让网关重载配置文件
      x-implemented: remote
      responses:
        "200":
          description: 已触发重载
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/GatewayUnavailable" }

  /admin/billing_records:
    get:
      operationId: getAdminBillingRecords
      tags: [Billing]
      summary: 计费流水
      x-implemented: local
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: user_id
          in: query
          schema: { type: integer, format: int64 }
        - name: api_key_id
          in: query
          schema: { type: integer, format: int64 }
        - name: model
          in: query
          schema: { type: string }
        - name: channel_name
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
          description: 服务端不校验取值
        - name: start
          in: query
          schema: { type: string, format: date-time }
          description: 非法值被静默忽略
        - name: end
          in: query
          schema: { type: string, format: date-time }
        - name: sort
          in: query
          schema: { type: string, enum: [cost_amount, revenue_amount, total_tokens, created_at] }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
          description: 只有 asc 生效
      responses:
        "200":
          description: 一页流水
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/BillingRecord" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/billing_records/{id}:
    get:
      operationId: getAdminBillingRecordsId
      tags: [Billing]
      summary: 单条计费流水
      x-implemented: remote
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 流水详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/BillingRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/request_records:
    get:
      operationId: getAdminRequestRecords
      tags: [Billing]
      summary: 调用记录
      x-implemented: local
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          schema: { type: string }
          description: 模糊匹配 model、request_id 与 user_agent
        - name: user_id
          in: query
          schema: { type: integer, format: int64 }
        - name: model
          in: query
          schema: { type: string }
        - name: user_agent
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [in_progress, success, error] }
        - name: error_code
          in: query
          schema: { type: string }
        - name: start
          in: query
          schema: { type: string, format: date-time }
        - name: end
          in: query
          schema: { type: string, format: date-time }
        - name: sort
          in: query
          schema:
            type: string
            enum: [total_tokens, latency_ms, ttfb_ms, tps, created_at]
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
          description: 只有 asc 生效
      responses:
        "200":
          description: 一页调用记录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/RequestRecord" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/request_records/filters:
    get:
      operationId: getAdminRequestRecordsFilters
      tags: [Billing]
      summary: 调用记录的筛选项
      description: 返回表里出现过的模型与 user agent，供筛选下拉用。响应用 data，不是 items
      x-implemented: local
      responses:
        "200":
          description: 可选筛选项
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          models: { type: array, items: { type: string } }
                          user_agents: { type: array, items: { type: string } }

  /admin/billing/reconciliation:
    get:
      operationId: getAdminBillingReconciliation
      tags: [Billing]
      summary: 未结算的请求
      description: |
        列出还没结算、且已经超过指定分钟的请求。固定上限 200 条，不分页，
        所以 total 等于本次返回的条数，不是全表计数。
      x-implemented: remote
      parameters:
        - name: minutes
          in: query
          schema: { type: integer, minimum: 1, default: 5 }
          description: 只看超过这么久还没结算的
      responses:
        "200":
          description: 候选清单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/RequestBinding" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/billing/reconciliation/{request_id}/resolve:
    post:
      operationId: postAdminBillingReconciliationRequestIdResolve
      tags: [Billing]
      summary: 处理一条未结算请求
      description: 拉取网关回传事件补记账。没有请求体
      x-implemented: remote
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 处理结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          request_id: { type: string }
                          status:
                            type: string
                            enum: [already_billed, marked_no_usage, billed]
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502":
          description: 拉取网关回传失败，或回传体解析失败（后者 code 为 bad_report）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /admin/dashboard/summary:
    get:
      operationId: getAdminDashboardSummary
      tags: [Dashboard]
      summary: 概览指标
      description: 统计窗口固定是最近 24 小时，不可调
      x-implemented: local
      responses:
        "200":
          description: 24 小时汇总
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          last_24h:
                            type: object
                            properties:
                              requests: { type: integer }
                              success: { type: integer }
                              success_rate: { type: number, description: 百分比，0 到 100 }
                              cost: { type: number }
                              revenue: { type: number }
                          low_balance_users:
                            type: integer
                            description: 启用用户里余额加授信已经不大于 0 的人数

  /admin/dashboard/usage:
    get:
      operationId: getAdminDashboardUsage
      tags: [Dashboard]
      summary: 按天的用量趋势
      x-implemented: local
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
          description: 超出范围或非法一律回退到 7
      responses:
        "200":
          description: 按天升序的序列。不分页，total 等于天数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            day: { type: string, description: "形如 2026-01-31" }
                            requests: { type: integer }
                            revenue: { type: number }

  /admin/channel-applications:
    get:
      operationId: getAdminChannelApplications
      tags: [ChannelApplications]
      summary: 渠道开通申请列表
      x-implemented: remote
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
          description: 其他取值被静默忽略
      responses:
        "200":
          description: 一页申请，每项多带一个 applicant_name
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ChannelApplication" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/channel-applications/{id}/approve:
    post:
      operationId: postAdminChannelApplicationsIdApprove
      tags: [ChannelApplications]
      summary: 通过申请
      description: |
        通过后会建出渠道分组与账号。请求体一律忽略，无字段可传。
        下发网关失败时多一个 warning，但仍是 201。
      x-implemented: remote
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: 已通过
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          group: { $ref: "#/components/schemas/ChannelGroup" }
                          account: { $ref: "#/components/schemas/ChannelAccount" }
                          application: { $ref: "#/components/schemas/ChannelApplication" }
                          warning: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 分组名冲突，或这条申请已经被处理过（code 为 already_reviewed）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /admin/channel-applications/{id}/reject:
    post:
      operationId: postAdminChannelApplicationsIdReject
      tags: [ChannelApplications]
      summary: 驳回申请
      x-implemented: remote
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, description: 驳回理由，必填 }
      responses:
        "200":
          description: 已驳回
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          application: { $ref: "#/components/schemas/ChannelApplication" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 申请已通过或已被处理（code 为 already_approved 或 already_reviewed）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /admin/error_rules:
    get:
      operationId: getAdminErrorRules
      tags: [Settings]
      summary: 错误规则列表
      description: 纯代理，规则由网关执行与保存
      x-implemented: remote
      responses:
        "200":
          description: 规则列表，空列表也返回 []
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          rules:
                            type: array
                            items: { $ref: "#/components/schemas/ErrorRule" }
        "503":
          description: 网关侧没启用规则功能
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "502": { $ref: "#/components/responses/GatewayUnavailable" }
    post:
      operationId: postAdminErrorRules
      tags: [Settings]
      summary: 新建错误规则
      x-implemented: remote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ErrorRule" }
      responses:
        "200":
          description: 建好了，id 由网关分配
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          rule: { $ref: "#/components/schemas/ErrorRule" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/error_rules/reorder:
    put:
      operationId: putAdminErrorRulesReorder
      tags: [Settings]
      summary: 调整规则顺序
      description: 静态段优先于 {id}，所以这个路径不会被当成规则 id
      x-implemented: remote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: integer }
                  description: 按新顺序排列的规则 id
      responses:
        "200":
          description: 已重排
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/error_rules/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: putAdminErrorRulesId
      tags: [Settings]
      summary: 改错误规则
      x-implemented: remote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ErrorRule" }
      responses:
        "200":
          description: 改好了
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteAdminErrorRulesId
      tags: [Settings]
      summary: 删错误规则
      description: 网关返回 404 也算删除成功
      x-implemented: remote
      responses:
        "200":
          description: 已删
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/platform-settings:
    get:
      operationId: getAdminPlatformSettings
      tags: [Settings]
