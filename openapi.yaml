        - apiKey: []
      responses:
        "200":
          description: 密钥列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/APIKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: postUserApiKeys
      tags: [UserPanel]
      summary: 给自己签一把密钥
      x-implemented: local
      security:
        - bearerSession: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 64 }
