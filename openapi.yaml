openapi: 3.1.0

info:
  title: TokenMP API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  summary: TokenMP 销售控制台的后端接口
  description: |
    这份文档描述两套东西：

    1. **线上后端**（Go + echo + MySQL），部署在 `https://tokenmp.top`。它是接口的权威定义，
       路径与字段都取自线上源码，不是推测。
    2. **本机实现**（SolidStart），已实现的有：认证、系统版本与公告通知，以及用户管理、
       余额账本（含管理员代充）、API 密钥、套餐定价、订阅续费这几组业务接口，跑在
       `http://localhost:6789`。转发产生的用量与调用日志不在本机后端，等网关回写。
       本地实现与线上有意不一致的地方见下面「两处差异」与「本机扩展」。

    ## 约定的响应形状

    成功、单对象、列表、错误各有固定信封（见 `internal/httpx/httpx.go`）：

    ```json
    {"ok": true}
    {"ok": true, "data": { ... }}
    {"ok": true, "items": [ ... ], "total": 128 }
    {"error": {"code": "invalid_credentials", "message": "账号或密码不正确"}}
    ```

    注意列表是把 `items` 和 `total` 放在**顶层**，不套在 `data` 里。

    ## 鉴权

    线上有四套，看路径前缀：

    | 前缀 | 鉴权方式 |
    | --- | --- |
    | `/auth/*` | 公开；`/auth/me` 与 `/auth/password` 需要用户会话 |
    | `/admin/*` | 管理员令牌 `X-Admin-Token`，或管理员会话 JWT，二选一 |
    | `/user/*` | 用户会话 JWT，或 `sk-` 开头的 API key，二选一 |
    | `/v1/*` | 用户的 API key，走 OpenAI 兼容协议 |

    会话 JWT 由 `/auth/login`、`/auth/register` 签发，HS256，claims 为
    `sub`（用户 id 的十进制字符串）、`email`、`v`（token_version）、`iss`、`iat`、`exp`，有效期 168 小时。
    改密码会把 `users.token_version` 加一，旧 token 随即失效。

    ## 两处差异

    本机实现是照线上抄的，但有两处故意不同，写在这里免得对不上：

    - **错误信封**：线上是 `{"error":{"code","message"}}`，本机是 `{"error":"一句话"}`（省掉了 code）。
      前端按 HTTP 状态码分支，不要读 code。
    - **列表分页**：两边都是 `page` 与 `size`（不是 `page_size`），响应都把 `items` 与 `total`
      放在**顶层**。唯一的例外是 `/user/credits`，它的 `total` 在 `data` 里。

    ## 本机扩展

    线上没有、本机自己加的字段与参数，都标了「本机扩展」，逐个列在这里：

    | 位置 | 扩展 | 说明 |
    | --- | --- | --- |
    | `POST /admin/balances/adjust` | 请求体 `source` | `adjust` 改授信、`recharge` 代充，默认 `adjust`。线上只有管理员调账一种语义 |
    | `UserBudget` | `enabled` | 库里有这一列，页面要用来显示开关状态；与 `amount=0` 一起表示没设预算 |
    | `PlanCore` | `features`、`recommended`、`sort_order` | 销售页卡片上的卖点清单、推荐标与排列顺序 |
    | `GET /admin/plans` | `subscribers`、查询参数 `status` | `subscribers` 是现算的活跃订阅用户数；`status=all` 连已软删的套餐一起回 |
    | `PlanActivationEvent.amount` | 符号 | 订阅是扣款（流水 `delta` 为负），这里回正数，读作「这次订阅花了多少」 |

    标注说明：`x-implemented` 有三个取值 —— `local` 本机已实现且线上也有，`local-only` 只有本机有、线上没有（系统那组：版本、公告、通知），`remote` 只存在于线上。

servers:
  - url: https://tokenmp.top
    description: 线上后端（Go + echo），接口定义以它为准
  - url: http://localhost:6789
    description: 本机 SolidStart 后端，认证、系统消息、用户与账本、客户端密钥、套餐这几组已实现

# 默认要鉴权。公开端点（/auth/login、/healthz 等）各自写了 security: [] 覆盖掉。
security:
  - bearerSession: []
  - adminToken: []

tags:
  - name: Internal
    description: 本机新增。给转发内核与支付渠道回调用的内部接口，不走会话，用共享密钥
  - name: Auth
    description: 注册、登录、会话。本机已实现
  - name: Users
    description: 后台的用户管理
  - name: Balances
    description: 余额调整与调整记录
  - name: Plans
    description: 套餐、套餐价格、订阅激活记录
  - name: Models
    description: 模型目录与分成比例
  - name: Channels
    description: 渠道分组与渠道账号
  - name: ChannelApplications
    description: 渠道开通申请的审核
  - name: Billing
    description: 计费记录、调用记录、对账
  - name: Dashboard
    description: 概览页的汇总与趋势
  - name: Gateway
    description: 网关配置与重载
  - name: Settings
    description: 平台设置、错误规则、共享账号
  - name: System
    description: 系统级的版本、公告、通知。本机实现（字段参照线上 postgres 的三张表），线上没有这组端点
  - name: UserPanel
    description: 用户端（https://tokenmp.top 的 /panel），本机未实现

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tokenmp_session
      description: 本机实现的会话 cookie。线上用的是 Authorization 头，见 bearerSession
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "线上 `/auth/login` 返回的 token，放 `Authorization: Bearer <token>`"
    adminToken:
      type: apiKey
      in: header
      name: Authorization
      description: |
        管理员令牌，放 `Authorization: Bearer <admin_token>`。
        `/admin/*` 下静态令牌与管理员会话 JWT 走同一个头：命中令牌就直接放行，
        否则当会话 JWT 解析并要求 `role=admin`。两者都不行返回 401 `invalid_admin_token`。
        线上 `auth.admin_token` 为空时这个检查直接放行。
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: "`sk-` 开头的用户 API key，`/user/*` 与 `/v1/*` 用它。"

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
      description: 页码
    PageSize:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: 每页条数，上限 100。注意参数名是 size，不是 page_size
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: 资源主键

  schemas:
    OkEnvelope:
      type: object
      description: 成功但没有数据要回
      required: [ok]
      properties:
        ok: { type: boolean, const: true }

    DataEnvelope:
      type: object
      description: 成功，回一个对象
      required: [ok, data]
      properties:
        ok: { type: boolean, const: true }
        data: {}

    ListEnvelope:
      type: object
      description: 成功，回一页列表。注意 items 与 total 在顶层，不套 data
      required: [ok, items, total]
      properties:
        ok: { type: boolean, const: true }
        items:
          type: array
          items: {}
        total:
          type: integer
          format: int64
          description: 符合条件的总条数，不是本页条数

    ErrorEnvelope:
      type: object
      description: 错误。线上用这个形状
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                业务错误码。这份枚举是把线上各 handler 里用到的字面量汇总起来的，
                以源码为准。
              enum:
                - bad_request
                - invalid_request
                - invalid_value
                - unsupported_param
                - unauthorized
                - invalid_credentials
                - invalid_code
                - code_expired
                - email_taken
                - account_disabled
                - invalid_admin_token
                - invalid_api_key
                - key_expired
                - forbidden
                - not_found
                - conflict
                - duplicate_name
                - duplicate_price
                - duplicate_account
                - already_reviewed
                - already_approved
                - rate_limited
                - no_account
                - invalid_days
                - insufficient_balance
                - upstream_error
                - ref_source_error
                - bad_report
                - gateway_sync_failed
                - gateway_unreachable
                - gateway_unavailable
                - gateway_rules_disabled
                - gateway_bad_response
                - internal
            message: { type: string, description: 给人看的中文说明 }
      example:
        error: { code: invalid_credentials, message: 账号或密码不正确 }

    LocalErrorEnvelope:
      type: object
      description: 本机实现的错误形状，只有一句话，没有 code
      required: [error]
      properties:
        error: { type: string }
      example:
        error: 账号或密码不正确

    Session:
      type: object
      description: 登录成功后签发的东西
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT。本机会同时写进 tokenmp_session cookie，线上只返回 token
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      description: 用户。本机这张表由线上两套用户表合并而来，多一个 source 字段
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: 登录名，注册时由邮箱 @ 前面那段生成 }
        email: { type: [string, "null"], format: email }
        role: { type: string, enum: [user, admin], default: user }
        status:
          type: integer
          description: "1 正常，0 停用。线上是 tinyint"
          enum: [0, 1]
        credit_limit:
          type: number
          description: 授信（credit_limit），线上是 decimal(14,8)
        plan_id: { type: [integer, "null"], format: int64 }
        token_version:
          type: integer
          format: int64
          description: 改密码时自增，用来让旧 token 失效
        source:
          type: string
          description: 本机独有，标记这条用户是从哪套线上表导入的
          enum: [local, sales, tokenmp_next]
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    UserBudget:
      type: object
      description: 用户的预算封顶。enabled=0 或 amount=0 都表示还没设，两个条件都要判
      properties:
        user_id: { type: integer, format: int64 }
        enabled: { type: integer, description: "本机扩展。1 启用、0 关闭" }
        amount: { type: number }
        period: { type: string, enum: [day, week, month] }
        period_start: { type: [string, "null"], format: date-time }
        period_end: { type: [string, "null"], format: date-time }
        used: { type: number, description: 本周期已用掉的量 }
        version: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }

    Subscription:
      type: object
      description: 当前订阅额度快照，只在用户有生效套餐时出现
      properties:
        plan_id: { type: integer, format: int64 }
        quota_kind: { type: string, enum: [money, requests] }
        quota_limit: { type: number }
        quota_used: { type: number }
        period_start: { type: [string, "null"], format: date-time }
        period_end: { type: [string, "null"], format: date-time }

    UserView:
      description: 管理端看的用户，比 User 多余额、预算和订阅快照
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            balance: { type: number, description: 可用余额，恒存在 }
            budget: { $ref: "#/components/schemas/UserBudget" }
            subscription: { $ref: "#/components/schemas/Subscription" }

    APIKey:
      type: object
      description: |
        用户 API 密钥。明文只在创建那一次返回，之后只能看到前缀和后缀。
        `key_hash` 的 JSON tag 是 `-`，任何响应都不会带上。
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        name: { type: [string, "null"] }
        key_prefix: { type: string, description: "明文前 9 个字符，形如 sk-abc123" }
        key_suffix: { type: [string, "null"], description: 明文末 6 位 }
        status: { type: integer }
        model_whitelist: { type: [array, "null"], items: { type: string } }
        rate_limit_per_min: { type: [integer, "null"] }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TokenCounts:
      type: object
      description: 五个 token 计数，多个模型里共用
      properties:
        prompt_tokens: { type: integer, format: int64 }
        completion_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
        total_tokens: { type: integer, format: int64 }

    BillingRecord:
      description: 计费流水
      allOf:
        - $ref: "#/components/schemas/TokenCounts"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            request_id: { type: string }
            user_id: { type: integer, format: int64 }
            api_key_id: { type: integer, format: int64 }
            plan_id: { type: integer, format: int64 }
            channel_id: { type: integer, format: int64 }
            channel_name: { type: string }
            owner_user_id: { type: integer, format: int64 }
            entry: { type: string }
            model: { type: string }
            stream: { type: boolean }
            usage_source: { type: string }
            charge_mode: { type: string }
            cost_multiplier: { type: number }
            cost_multiplier_rules: { type: [array, "null"], items: {} }
            cost_amount: { type: number }
            revenue_multiplier: { type: number }
            revenue_multiplier_rules: { type: [array, "null"], items: {} }
            revenue_amount: { type: number }
            owner_credit_amount: { type: number, description: 渠道分成 }
            currency: { type: string }
            billing_mode: { type: string }
            ledger: { type: string }
            latency_ms: { type: [integer, "null"] }
            http_status: { type: [integer, "null"] }
            attempts: { type: [integer, "null"] }
            retried: { type: [boolean, "null"] }
            status: { type: string }
            created_at: { type: string, format: date-time }

    RequestRecord:
      description: 一次调用的记录（含失败）
      allOf:
        - $ref: "#/components/schemas/TokenCounts"
        - type: object
          properties:
            request_id: { type: string }
            user_id: { type: integer, format: int64 }
            api_key_id: { type: integer, format: int64 }
            model: { type: string }
            served_model: { type: [string, "null"] }
            entry: { type: string }
            stream: { type: boolean }
            channel: { type: string }
            channel_type: { type: string }
            base_url: { type: [string, "null"] }
            status: { type: string, enum: [in_progress, success, error] }
            http_status: { type: [integer, "null"] }
            error_message: { type: [string, "null"] }
            error_code: { type: [string, "null"] }
            render_status: { type: [integer, "null"] }
            upstream_code: { type: [string, "null"] }
            upstream_message: { type: [string, "null"] }
            panel_message: { type: [string, "null"] }
            attempts: { type: [integer, "null"] }
            retried: { type: [boolean, "null"] }
            user_agent: { type: [string, "null"] }
            reasoning_effort: { type: [string, "null"] }
            latency_ms: { type: [integer, "null"] }
            ttfb_ms: { type: [integer, "null"] }
            tps: { type: [number, "null"] }
            started_at: { type: [string, "null"], format: date-time }
            finished_at: { type: [string, "null"], format: date-time }
            created_at: { type: string, format: date-time }

    RequestBinding:
      type: object
      description: 请求与计费的绑定关系，对账用
      properties:
        request_id: { type: string }
        user_id: { type: integer, format: int64 }
        api_key_id: { type: integer, format: int64 }
        plan_id: { type: [integer, "null"], format: int64 }
        model: { type: string }
        entry: { type: string }
        stream: { type: boolean }
        user_agent: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        settled_at: { type: [string, "null"], format: date-time }

    AdjustLogItem:
      type: object
      description: 一次手工调账的记录
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        user_name: { type: string }
        delta: { type: number, description: 正数入账，负数扣款 }
        balance_after: { type: number }
        ref_id: { type: string }
        reason: { type: string }
        operator: { type: string, description: 操作人（管理员） }
        created_at: { type: string, format: date-time }

    RateRule:
      type: object
      description: 按时段与模型的倍率规则
      properties:
        name: { type: string }
        model: { type: string, description: 不填则对组内全部模型生效 }
        timezone: { type: string }
        days_of_week: { type: array, items: { type: integer } }
        start_time: { type: string, description: "形如 09:00" }
        end_time: { type: string }
        multiplier: { type: number }
        compose_mode: { type: string }
        priority: { type: integer }
        effective_from: { type: string }
        effective_until: { type: string }

    ModelConfig:
      type: object
      description: 单个模型的上下文与推理配置
      properties:
        context_window: { type: integer }
        max_tokens: { type: integer }
        reasoning_effort: { type: string }

    CostTier:
      type: object
      description: 阶梯价的一档
      properties:
        up_to_input_tokens: { type: integer }
        input_per_million: { type: number }
        output_per_million: { type: number }
        cache_read_per_million: { type: number }
        cache_write_per_million: { type: number }

    ModelCost:
      type: object
      description: 一个模型的单价，单位是每百万 token
      properties:
        input_per_million: { type: number }
        output_per_million: { type: number }
        cache_read_per_million: { type: number }
        cache_write_per_million: { type: number }
        per_request: { type: number, description: 按次计费时用 }
        tiers: { type: array, items: { $ref: "#/components/schemas/CostTier" } }

    CostBlock:
      type: object
      description: 渠道组与申请里的成本配置。前六个字段是拍平在对象上的
      properties:
        cost_mode: { type: string }
        cost_input_per_million: { type: number }
        cost_output_per_million: { type: number }
        cost_cache_read_per_million: { type: number }
        cost_cache_write_per_million: { type: number }
        cost_per_request: { type: number }
        cost_tiers: { type: array, items: { $ref: "#/components/schemas/CostTier" } }
        cost_models:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ModelCost" }
        model_configs:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ModelConfig" }
        rate_rules: { type: array, items: { $ref: "#/components/schemas/RateRule" } }

    RechargeOrder:
      type: object
      description: 本机新增。充值单，管理员代充不经过它
      properties:
        id: { type: integer, format: int64 }
        order_no: { type: string }
        user_id: { type: integer, format: int64 }
        amount: { type: number }
        currency: { type: string }
        channel: { type: string, description: mock / wechat / alipay / stripe }
        status: { type: string, enum: [pending, paid, failed, cancelled, refunded] }
        external_no: { type: [string, "null"], description: 渠道流水号 }
        paid_at: { type: [string, "null"], format: date-time }
        credit_transaction_id: { type: [integer, "null"], format: int64, description: 入账的那条流水，用来查这单有没有真的入过账 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PlanCore:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        mode: { type: string, enum: [pay_as_you_go, subscription] }
        pricing_mode: { type: string, enum: [markup, table] }
        markup_multiplier: { type: number }
        rate_rules: { type: array, items: { $ref: "#/components/schemas/RateRule" } }
        quota_kind: { type: string, enum: [money, requests] }
        quota_amount: { type: number }
        quota_period_days: { type: integer }
        overage_mode: { type: string, enum: [disabled, bill] }
        price: { type: number }
        currency: { type: string }
        status: { type: integer, description: 0 表示已删 }
        features:
          type: [array, "null"]
          items: { type: string }
          description: 本机扩展。销售页卡片上的卖点清单
        recommended: { type: integer, description: "本机扩展。1 表示卡片上打推荐标" }
        sort_order: { type: integer, description: "本机扩展。数字小的排前面" }
        subscribers: { type: integer, description: "本机扩展。仅列表返回，当前活跃订阅的去重用户数，不落库" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PlanPrice:
      type: object
      description: 套餐里针对某个模型的定价
      properties:
        id: { type: integer, format: int64 }
        plan_id: { type: integer, format: int64 }
        model: { type: string }
        cost_mode: { type: string, enum: [token, request] }
        input_per_million: { type: number }
        output_per_million: { type: number }
        cache_read_per_million: { type: number }
        cache_write_per_million: { type: number }
        per_request: { type: number }
        request_weight: { type: number }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiKeyLookup:
      type: object
      description: |
        本机新增。转发内核校验客户端密钥的结果：密钥归属的用户与密钥本身、要拿去限流
        与选路的字段，以及该用户当前套餐的计价口径。
      required: [user_id, api_key_id, model_whitelist, rate_limit_per_min, expires_at, pricing]
      properties:
        user_id: { type: integer, format: int64 }
        api_key_id: { type: integer, format: int64 }
        model_whitelist:
          type: [array, "null"]
          description: 空表示不限制模型
          items: { type: string }
        rate_limit_per_min: { type: [integer, "null"], description: 空表示不限速 }
        expires_at: { type: [string, "null"], format: date-time, description: 空表示永不过期 }
        pricing:
          type: object
          required: [plan_id, pricing_mode, markup_multiplier, prices]
          properties:
            plan_id: { type: [integer, "null"], format: int64, description: 空表示该用户没有套餐 }
            pricing_mode: { type: [string, "null"], enum: [markup, table, null] }
            markup_multiplier: { type: [number, "null"], description: 只有 markup 模式用得上 }
            prices:
              type: array
              description: table 模式给该套餐的全部模型价；markup 模式与没有套餐时是空数组
              items:
                type: object
                properties:
                  model: { type: string }
                  cost_mode: { type: string, enum: [token, request] }
                  input_per_million: { type: number }
                  output_per_million: { type: number }
                  cache_read_per_million: { type: number }
                  cache_write_per_million: { type: number }
                  per_request: { type: number }
                  request_weight: { type: number }

    ChannelGroup:
      description: 渠道分组。渠道凭据（去上游的那把）是 `json:"-"`，任何响应都不回显
      allOf:
        - $ref: "#/components/schemas/CostBlock"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            type: { type: string, enum: [openai, anthropic] }
            base_url: { type: string }
            models: { type: array, items: { type: string } }
            upstream_models:
              type: object
              additionalProperties: { type: string }
            supports: { type: array, items: { type: string } }
            share_policy: { type: string, enum: [platform, public] }
            share_rate: { type: number }
            owner_user_id: { type: integer, format: int64, description: 空表示平台自营 }
            allow_user_accounts: { type: boolean }
            key_guide_url: { type: string }
            official: { type: boolean }
            disabled: { type: integer }
            source: { type: string, enum: [official, user, platform] }
            synced: { type: integer }
            last_sync_at: { type: string, format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    ChannelAccount:
      type: object
      description: 组下的一个上游账号。`api_key_enc` 是 `json:"-"`，不回显
      properties:
        id: { type: integer, format: int64 }
        group_id: { type: integer, format: int64 }
        name: { type: string }
        channel_name: { type: string, description: "形如 {组名}__{账号名}" }
        weight: { type: number }
        cost_multiplier: { type: number }
        owner_user_id: { type: integer, format: int64 }
        share_rate: { type: number }
        public: { type: boolean }
        share_state: { type: string, enum: [private, pending, public] }
        probe_models: { type: string, description: 逗号分隔 }
        probe_at: { type: [string, "null"], format: date-time }
        disabled: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChannelApplication:
      description: 客户提交的渠道开通申请。`api_key_enc` 不回显
      allOf:
        - $ref: "#/components/schemas/CostBlock"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            applicant_user_id: { type: integer, format: int64 }
            applicant_name: { type: string, description: 仅管理端列表返回 }
            name: { type: string }
            type: { type: string, enum: [openai, anthropic] }
            base_url: { type: string }
            models: { type: array, items: { type: string } }
            upstream_models:
              type: object
              additionalProperties: { type: string }
            supports: { type: array, items: { type: string } }
            share_rate: { type: number }
            status: { type: string, enum: [pending, approved, rejected] }
            admin_note: { type: string }
            reviewed_at: { type: string, format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    ModelShareRate:
      type: object
      properties:
        id: { type: integer, format: int64 }
        model: { type: string }
        share_rate: { type: number }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ErrorRule:
      type: object
      description: 错误处理规则，由网关执行
      properties:
        id: { type: integer, description: 只读，由网关分配 }
        enabled: { type: boolean }
        name: { type: string }
        when:
          type: object
          description: 命中条件，各字段都是可选的
          properties:
            kind:
              type: string
              enum: [transport, auth_rejected, upstream_status, invalid_request, client_gone]
            status: { type: integer }
            code: { type: string }
            upstream_code: { type: string }
            upstream_code_prefix: { type: string }
            message_regex: { type: string }
            channel_type: { type: string, enum: [openai, anthropic] }
            model: { type: string }
            channels: { type: array, items: { type: string } }
            accounts: { type: array, items: { type: string } }
        return:
          type: object
          description: 命中后改写成什么
          properties:
            status: { type: integer }
            code: { type: string }
            message: { type: string }
            panel_message: { type: string }
            include_request_id: { type: boolean }

    AdminModelView:
      type: object
      properties:
        model: { type: string }
        channels: { type: [array, "null"], items: { type: string } }
        config: { $ref: "#/components/schemas/ModelConfig" }

    PlatformSettings:
      type: object
      properties:
        share_default_rate: { type: number }
        share_source: { type: string, enum: [database, config_default] }
        currency: { type: string }
        balance_check: { type: boolean }
        default_plan_name: { type: string }
        ratelimit_per_min: { type: integer }
        request_record:
          type: object
          properties:
            enabled: { type: boolean }
            sample_rate: { type: number }
            retention_days: { type: integer }
        smtp_enabled: { type: boolean }

    GatewayBalancer:
      type: object
      description: |
        负载均衡配置。这份结构是网关服务与前端约定的，sale 仓库里没有对应定义，
        所以字段以实际返回为准。
      properties:
        strategy: { type: string, enum: [weighted_random, softmax] }
        softmax:
          type: object
          properties:
            temperature: { type: number }
            metric: { type: string, enum: [weight, latency, speed, error_rate, cost] }
            metric_weights: { type: object }
            latency_reference_ms: { type: number }
            speed_reference_tps: { type: number }
        degradation:
          type: object
          properties:
            enabled: { type: boolean }
            error_rate_threshold: { type: number }
            latency_ms_threshold: { type: number }
            weight_penalty: { type: number }
            window: { type: integer }

    GatewayStaticParams:
      type: object
      description: 网关的静态参数，时长统一写成 300s 这样的字符串
      properties:
        timeout:
          type: object
          properties:
            non_stream_overall: { type: string }
            stream_first_byte: { type: string }
            stream_idle: { type: string }
        retry:
          type: object
          properties:
            channel_retries: { type: integer }
            cross_channel_retries: { type: integer }
            max_total_attempts: { type: integer }
        health_check:
          type: object
          properties:
            failure_threshold: { type: integer }
            failure_window: { type: string }
            cooldown_ttl: { type: string }
            cooldown_max: { type: string }
        sticky:
          type: object
          properties:
            enabled: { type: boolean }

    ShareAccountRow:
      type: object
      description: 审核列表里的一行，比 ChannelAccount 多属主与渠道分成
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        channel_name: { type: string }
        group_id: { type: integer, format: int64 }
        group_name: { type: string }
        owner_user_id: { type: integer, format: int64 }
        owner_name: { type: string }
        share_rate: { type: [number, "null"] }
        public: { type: boolean }
        share_state: { type: string, enum: [private, pending, public] }
        weight: { type: number }
        disabled: { type: integer }
        total_credit: { type: number }
        recent_credit: { type: number }
        created_at: { type: string, format: date-time }

    PlanActivationRow:
      type: object
      description: 按用户聚合的套餐激活情况
      properties:
        user_id: { type: integer, format: int64 }
        user_name: { type: string }
        plan_id: { type: integer, format: int64 }
        plan_name: { type: string }
        plan_mode: { type: string }
        quota_kind: { type: string }
        quota_limit: { type: number }
        quota_used: { type: number }
        period_start: { type: [string, "null"], format: date-time }
        period_end: { type: [string, "null"], format: date-time }
        total_spend: { type: number }
        activation_count: { type: integer }
        first_at: { type: [string, "null"], format: date-time }

    PlanActivationEvent:
      type: object
      description: 一次套餐激活事件，来自账单流水
      properties:
        created_at: { type: string, format: date-time }
        amount: { type: number, description: "本机扩展。订阅流水 delta 为负，这里回正数，读作这次订阅花了多少" }
        ref_id: { type: string, description: "形如 plan-3" }
        plan_name: { type: string, description: 套餐已删则为空串 }
        balance_after: { type: number }

    PlanCreateRequest:
      type: object
      description: 新建与整体替换套餐共用的请求体
      required: [name, mode, pricing_mode]
      properties:
        name: { type: string, maxLength: 64 }
        mode: { type: string, enum: [pay_as_you_go, subscription] }
        pricing_mode: { type: string, enum: [markup, table] }
        markup_multiplier: { type: number, exclusiveMinimum: 0 }
        rate_rules: { type: array, items: { $ref: "#/components/schemas/RateRule" } }
        quota_kind: { type: string, enum: [money, requests] }
        quota_amount: { type: number, exclusiveMinimum: 0 }
        quota_period_days: { type: integer, exclusiveMinimum: 0 }
        overage_mode: { type: string, enum: [disabled, bill] }
        price: { type: number, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }

    CostInput:
      type: object
      description: 请求里的成本配置。形状与响应侧的 CostBlock 不同，这里是嵌套的
      properties:
        mode: { type: string }
        default: { $ref: "#/components/schemas/ModelCost" }
        tiers: { type: array, items: { $ref: "#/components/schemas/CostTier" } }
        models:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ModelCost" }
        rules: { type: array, items: { $ref: "#/components/schemas/RateRule" } }

    ChannelGroupRequest:
      type: object
      description: 新建与整体替换渠道分组共用的请求体
      required: [name, type, base_url, models]
      properties:
        name: { type: string, maxLength: 64 }
        type: { type: string, enum: [openai, anthropic] }
        base_url: { type: string }
        models: { type: array, minItems: 1, items: { type: string } }
        upstream_models:
          type: object
          additionalProperties: { type: string }
        supports: { type: array, items: { type: string } }
        cost: { $ref: "#/components/schemas/CostInput" }
        model_configs:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ModelConfig" }
        share_policy: { type: string, enum: [platform, public], description: 空则按 platform }
        share_rate: { type: number, exclusiveMinimum: 0, maximum: 1 }
        owner_user_id: { type: [integer, "null"], format: int64, description: 空表示平台自营 }
        allow_user_accounts: { type: [boolean, "null"], description: 三态，null 表示不改动现有值 }
        official: { type: [boolean, "null"], description: 三态 }
        key_guide_url: { type: string, maxLength: 512 }

    ProviderCheckSummary:
      type: object
      properties:
        provider: { type: string }
        channels: { type: integer }
        ref_models: { type: integer }
        errors: { type: array, items: { type: string } }

    RefPriceView:
      type: object
      properties:
        input_per_million: { type: number }
        output_per_million: { type: number }
        cache_read_per_million: { type: number }
        source: { type: string }
        checked_at: { type: string, format: date-time }

    PriceFinding:
      type: object
      properties:
        kind: { type: string }
        channel: { type: string }
        model: { type: string }
        upstream_model: { type: string }
        current: { $ref: "#/components/schemas/ModelCost" }
        reference: { $ref: "#/components/schemas/RefPriceView" }

    PriceCheckReport:
      type: object
      properties:
        checked_at: { type: string, format: date-time }
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderCheckSummary" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/PriceFinding" }

    ModelPrice:
      type: object
      properties:
        model: { type: string }
        input_per_million: { type: number }
        output_per_million: { type: number }
        cache_read_per_million: { type: number }
        source: { type: string }
        checked_at: { type: string, format: date-time }

    ProviderCatalog:
      type: object
      properties:
        sources:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
        providers:
          type: object
          description: 键是来源 id（pydantic、models.dev），值是厂商名数组
          additionalProperties:
            type: array
            items: { type: string }
        host_map:
          type: object
          description: 键是域名后缀，值是厂商名
          additionalProperties: { type: string }

    LocalSession:
      type: object
      description: |
        本机登录与注册成功的响应形状。token 与 user 在顶层，不套 data
        —— 这是与线上的一处有意差异（线上是 `{ok,data:{token,user}}`）
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    PanelMe:
      type: object
      description: 用户端的当前用户，比管理端多了余额、授信与预算
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }
        status: { type: integer }
        role: { type: string }
        credit_limit: { type: number }
        credit_available: { type: number }
        plan_id: { type: integer, format: int64 }
        balance: { type: number }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        budget:
          type: [object, "null"]
          properties:
            amount: { type: number }
            period: { type: string, enum: [day, week, month] }
            used: { type: number }
            remaining: { type: number }

    CreditTransaction:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        delta: { type: number }
        balance_after: { type: number }
        source:
          type: string
          enum: [recharge, adjust, usage, channel_share, subscription, refund]
          description: 本机在线上五个取值之外加了 refund，用于退给用户的钱
        ref_id: { type: string }
        created_at: { type: string, format: date-time }
        detail: { description: 原样透出的 JSON }
        model: { type: string }
        total_tokens: { type: integer, format: int64 }
        balance_part: { type: number }
        credit_part: { type: number }

    CreditsSummary:
      type: object
      description: "注意这里是例外：total 在 data 里，其他分页端点的 total 都在顶层"
      properties:
        balance: { type: number }
        credit_limit: { type: number }
        credit_available: { type: number }
        total: { type: integer, format: int64 }
        transactions:
          type: array
          items: { $ref: "#/components/schemas/CreditTransaction" }

    UsageSeriesItem:
      type: object
      properties:
        date: { type: string }
        requests: { type: integer }
        tokens: { type: integer, format: int64 }
        revenue: { type: number }
        models:
          type: array
          items:
            type: object
            properties:
              model: { type: string }
              requests: { type: integer }
              tokens: { type: integer, format: int64 }
              revenue: { type: number }

    CatalogChannel:
      type: object
      properties:
        kind: { type: string, const: group }
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { type: string }
        base_url: { type: string }
        supports: { type: array, items: { type: string } }
        cost: { $ref: "#/components/schemas/CostBlock" }
        cost_models: { type: object }
        model_configs: { type: object }
        rate_rules: { type: array, items: { $ref: "#/components/schemas/RateRule" } }
        user_shared: { type: boolean }
        source: { type: string, enum: [official, user, platform] }
        accounts:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              weight: { type: number }
              cost_multiplier: { type: number }
              owner: { type: string, enum: [user, platform] }

    CatalogModel:
      type: object
      properties:
        model: { type: string }
        channels:
          type: array
          items: { $ref: "#/components/schemas/CatalogChannel" }

    PanelPlan:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        mode: { type: string, enum: [subscription, pay_as_you_go] }
        quota_kind: { type: string, enum: [money, requests] }
        pricing_mode: { type: string, enum: [markup, table] }
        markup_multiplier: { type: number }
        price: { type: number }
        quota_amount: { type: number }
        quota_period_days: { type: integer }
        overage_mode: { type: string, enum: [disabled, bill] }
        currency: { type: string }
        model_count: { type: integer }
        weight_min: { type: number }
        weight_max: { type: number }
        updated_at: { type: string, format: date-time }

    VersionInfo:
      type: object
      description: 系统版本号。本机从 system_config 的 system_version 读，线上没有这个端点
      properties:
        version: { type: [string, "null"], description: "形如 0.1.0" }
        released_at: { type: [string, "null"], format: date }
        channel: { type: [string, "null"], enum: [dev, prod, null], description: 区分环境 }

    Announcement:
      type: object
      description: 公告。面向全站，线上「v0.1.0 正式发布」就是用公告发的，版本说明不用另建表
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        body: { type: string }
        severity: { type: string, enum: [info, warning, urgent] }
        scope: { type: string, description: 作用范围，目前只有 all }
        dismissible: { type: boolean, description: 用户能不能自己关掉 }
        status: { type: string, enum: [draft, published, archived] }
        sort_order: { type: integer, description: 数字小的排前面 }
        publish_from: { type: string, format: date-time }
        publish_until: { type: [string, "null"], format: date-time, description: 为空表示一直有效 }
        created_by: { type: [integer, "null"], format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        dismissed:
          type: boolean
          description: 仅用户端列表返回，表示当前用户关没关过这条；未登录时恒为 false

    AnnouncementStatusCounts:
      type: object
      description: |
        各状态公告的全站条数，给管理页页头那四张卡用。
        只在 `GET /api/admin/announcements` 的响应里，不随该请求的 `status` 筛选变。
      required: [total, draft, published, archived]
      properties:
        total: { type: integer, description: 三种状态相加 }
        draft: { type: integer }
        published: { type: integer }
        archived: { type: integer }

    Notification:
      type: object
      description: 站内通知，面向单个用户
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        type: { type: string, description: "业务类型，前端拿它挑图标，如 balance_low、key_expiring" }
        title: { type: string }
        body: { type: [string, "null"] }
        severity: { type: string, enum: [info, warning, urgent] }
        action_label: { type: [string, "null"], description: action_url 的按钮文字 }
        action_url: { type: [string, "null"] }
        metadata: { type: [object, "null"], description: 业务侧附带的 JSON }
        read_at: { type: [string, "null"], format: date-time, description: 为空即未读 }
        expires_at: { type: [string, "null"], format: date-time }
        idempotency_key: { type: [string, "null"], description: 幂等键，同一个业务事件重复投递时靠它去重 }
        created_at: { type: string, format: date-time }

    NotificationPage:
      description: 通知列表，多带一个未读数，省得前端再请求一次
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Notification" }
            unread: { type: integer, description: 未读条数（不受 unread 筛选影响） }

  responses:
    BadRequest:
      description: 参数不合法
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: bad_request, message: 参数有误 }
    Unauthorized:
      description: 未登录、凭据无效，或会话已失效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: invalid_admin_token, message: 管理员凭据无效 }
    Forbidden:
      description: 已登录，但没有权限改这个资源
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: forbidden, message: 无权操作 }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: not_found, message: 记录不存在 }
    RateLimited:
      description: 触发频控
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: rate_limited, message: 操作过于频繁，请稍后再试 }
    InternalError:
      description: 服务端出错
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: internal, message: 服务端错误 }
    GatewayUnavailable:
      description: 网关不可达或返回异常
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: gateway_unavailable, message: 网关暂时不可用 }
    GatewaySyncFailed:
      description: 数据已存库，但下发到网关失败
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: gateway_sync_failed, message: 同步到网关失败 }

paths:
  /user/plans/cancel:
    post:
      operationId: postUserPlansCancel
      tags: [UserPanel]
      summary: 结束当前订阅
      description: |
        本机新增。取当前生效订阅（active 且未过期、period_end 最晚那条），置为 cancelled，
        并把 users.plan_id 清空。**不退款**，剩余订阅额度作废；要退钱走管理端那个端点。
      x-implemented: local
      security:
        - bearerSession: []
      responses:
        "200":
          description: 已取消
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          plan_id: { type: integer, format: int64 }
                          cancelled_at: { type: string, format: date-time }
                          forfeited_quota: { type: number, description: 作废掉的剩余订阅额度 }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users/{id}/subscription:
    post:
      operationId: postAdminUsersIdSubscription
      tags: [Plans]
      summary: 管理端退订，可带退款
      description: |
        本机新增。取消该用户的生效订阅；`refund=true` 时按剩余天数折算退款额，
        写一条 source=refund 的流水。折算为 0 或负数时不记账。
        `quota_kind=requests` 的套餐退款额为 0（次数退不回钱）。
      x-implemented: local
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refund: { type: boolean, default: false }
                reason: { type: string, maxLength: 256 }
      responses:
        "200":
          description: 已退订
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          plan_id: { type: integer, format: int64 }
                          refund_amount: { type: number }
                          balance_after: { type: number }
        "404": { $ref: "#/components/responses/NotFound" }

  /user/recharge:
    get:
      operationId: getUserRechargeOrders
      tags: [UserPanel]
      summary: 我的充值单
      x-implemented: local
      security:
        - bearerSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 一页充值单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/RechargeOrder" }
    post:
      operationId: postUserRecharge
      tags: [UserPanel]
      summary: 下一张充值单
      description: |
        本机新增。没接真实支付渠道，默认 `channel=mock`，入账要等回调。
        真接渠道时只需换回调来源与验签。
      x-implemented: local
      security:
        - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, exclusiveMinimum: 0 }
                channel: { type: string, default: mock }
      responses:
        "201":
          description: 单子已建，状态 pending
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RechargeOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /internal/recharge-callback:
    post:
      operationId: postInternalRechargeCallback
      tags: [Internal]
      summary: 充值渠道回调
      description: |
        本机新增。不走会话，用 `x-callback-secret` 头校验（环境变量 RECHARGE_CALLBACK_SECRET）。
        **按 order_no 幂等**：同一张单重复回调只在第一次入账，重复的返回 `{ok:true, already:true}`。
      x-implemented: local
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_no, status]
              properties:
                order_no: { type: string }
                status: { type: string, enum: [paid, failed] }
                external_no: { type: string }
                amount: { type: number }
      responses:
        "200":
          description: 处理完了。already=true 表示这单之前已经入过账
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      already: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/records:
    post:
      operationId: postInternalRecords
      tags: [Internal]
      summary: 转发内核回写调用记录与计费
      description: |
        本机新增。批量摄入，按 `request_id` 幂等（重复提交不会记两遍）。
        同样用 `x-callback-secret` 头校验。网关接上后由它推送。
      x-implemented: local
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                records:
                  type: array
                  items: { $ref: "#/components/schemas/RequestRecord" }
                billing:
                  type: array
                  items: { $ref: "#/components/schemas/BillingRecord" }
      responses:
        "200":
          description: 摄入结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      inserted: { type: integer }
                      skipped: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /internal/api-key:
    post:
      operationId: postInternalApiKey
      tags: [Internal]
      summary: 校验客户端密钥，返回身份与计价口径
      description: |
        本机新增。转发内核在转发路径上调它（按密钥缓存，每个缓存周期一次），
        输入客户端密钥明文，拿回这次调用算在谁头上、要不要拦，以及收多少钱的口径。

        密钥明文只放请求体，不放 URL。按 sha256 查一次唯一索引 `uk_api_keys_hash`，
        不走 bcrypt —— 这条路径在转发链路上，每条请求至少一次。

        鉴权用 `x-callback-secret`（环境变量 RECORDS_CALLBACK_SECRET，与记录摄入同一把）。
        失败分开回：密钥不存在 404、密钥或账号停用 403、密钥过期 410。

        没有套餐的用户：`plan_id`、`pricing_mode`、`markup_multiplier` 都是 null，
        `prices` 是空数组，内核据此只推用量、不算钱。`table` 模式给该套餐的全部
        模型价，`markup` 模式 `prices` 是空数组。上游成本单价不在这个响应里。
      x-implemented: local
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, description: 客户端密钥明文 }
      responses:
        "200":
          description: 身份、限流白名单与计价口径
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ApiKeyLookup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: 密钥已过期
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: key_expired, message: 密钥已过期 }

  /admin/recharge:
    get:
      operationId: getAdminRechargeOrders
      tags: [Balances]
      summary: 充值单列表
      description: |
        本机新增。给运营看谁充了多少、哪一单还挂着、哪一单回调失败。
        注意它与「计费流水」不是一回事：那边是调用扣费，这边是充值单。
        `credit_transaction_id` 为空表示这单还没入账。
      x-implemented: local
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: user_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [pending, paid, failed, cancelled, refunded] }
        - name: channel
          in: query
          schema: { type: string }
        - name: start
          in: query
          schema: { type: string, format: date-time }
          description: 闭区间；非法值静默忽略
        - name: end
          in: query
          schema: { type: string, format: date-time }
          description: 闭区间；非法值静默忽略
      responses:
        "200":
          description: 一页充值单，按创建时间倒序
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/RechargeOrder"
                            - type: object
                              properties:
                                user_name: { type: [string, "null"] }
                                user_email: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [Dashboard]
      summary: 概览（summary 与 usage 的合并入口）
      description: 本机新增。一次把概览指标与按天用量都取回来，省一次往返。
      x-implemented: local
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 14 }
      responses:
        "200":
          description: 指标与趋势
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { type: object }

  /healthz:
    get:
      operationId: getHealthz
      tags: [Settings]
      summary: 存活探针
      security: []
      x-implemented: remote
      responses:
        "200":
          description: 服务活着
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"

  /readyz:
    get:
      operationId: getReadyz
      tags: [Settings]
      summary: 就绪探针（检查 DB 与 Redis 连通）
      security: []
      x-implemented: remote
      responses:
        "200":
          description: 依赖都通
        "503":
          description: 依赖不通
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: false }
                  error: { type: string }

  /auth/send-code:
    post:
      operationId: postAuthSendCode
      tags: [Auth]
      summary: 给邮箱发注册验证码
      description: |
        验证码 6 位数字，存 Redis，5 分钟有效，同一邮箱 60 秒内不能重发。
        无论邮箱是否已注册都返回成功，避免被拿来枚举账号。
        线上 SMTP 当前是关的，验证码只写进服务日志。

        **本机未实现。**
      security: []
      x-implemented: remote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: 已发送（或已被限流前调用过）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/register:
    post:
      operationId: postAuthRegister
      tags: [Auth]
      summary: 注册
      description: |
        线上要求先拿验证码再注册；**本机跳过了验证码**，直接建账号，
        所以本机不接受 `code` 字段。这是两边有意保留的差异。
      security: []
      x-implemented: local
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, description: 线上 min=8；本机也要求至少 8 位 }
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                  description: 6 位数字验证码。线上必填，本机忽略
                name: { type: string, description: 仅本机支持；线上由邮箱前缀自动生成 }
      responses:
        "200":
          description: 线上：注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Session" }
        "201":
          description: 本机：注册成功，响应体是顶层 token 与 user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: 邮箱或用户名已被占用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: email_taken, message: 邮箱已被占用 }

  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [Auth]
      summary: 登录
      description: |
        线上只收 `email`；本机还接受用户名（因为本地库合并了控制台与用户端两套用户表，
        前者用 name 登录），并且会把邮箱转成小写再比对。
        本机同时把 token 写进 `tokenmp_session` cookie。
      security: []
      x-implemented: local
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                email: { type: string, description: 线上必填；本机可改用 username }
                username: { type: string, description: 仅本机；与 email 二选一 }
                password: { type: string }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: 账号或密码不正确
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalErrorEnvelope" }
              example: { error: 账号或密码不正确 }
        "403":
          description: 账号已停用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalErrorEnvelope" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [Auth]
      summary: 退出登录
      description: |
        会话是无状态 JWT，服务端没有可清的东西，清掉 cookie 就算退出。

        **本机新增，线上没有这个端点。**
      x-implemented: local
      responses:
        "200":
          description: 已退出，下发清除 cookie 的头
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkEnvelope" }

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [Auth]
      summary: 当前登录用户
      x-implemented: local
      security:
        - bearerSession: []
        - sessionCookie: []
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/password:
    post:
      operationId: postAuthPassword
      tags: [Auth]
      summary: 修改密码
      description: |
        改完把 `token_version` 加一，旧 token 随即失效，同时返回新签的 token。

        **本机未实现。**
      x-implemented: local
      security:
        - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "200":
          description: 改好了，返回新 token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [Users]
      summary: 用户列表
      x-implemented: local
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          schema: { type: string }
          description: 按用户名或邮箱模糊匹配（本机把邮箱也纳入匹配）
        - name: status
          in: query
          schema: { type: string, enum: ["0", "1"] }
          description: 按状态筛（1 正常、0 停用）。本机新增；非法值静默忽略
        - name: sort
          in: query
          schema: { type: string, enum: [credit_limit, created_at, updated_at, name] }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
          description: 只有 asc 生效，其余一律降序
      responses:
        "200":
          description: 一页用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/UserView" }
    post:
      operationId: postAdminUsers
      tags: [Users]
      summary: 新建用户
      x-implemented: local
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                credit_limit: { type: number, minimum: 0, default: 0 }
                plan_id: { type: [integer, "null"], format: int64 }
                email: { type: [string, "null"], format: email }
                password: { type: [string, "null"], minLength: 8 }
      responses:
        "200":
          description: 建好了
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: 用户名或邮箱冲突
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: duplicate_name, message: 用户名已存在 }

  /admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getAdminUsersId
      tags: [Users]
      summary: 用户详情
      x-implemented: local
      responses:
        "200":
          description: 含余额、预算与订阅快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putAdminUsersId
      tags: [Users]
      summary: 改用户
      description: "字段都是可选的，不传就不改。传 `plan_id: null` 是解绑。改密码会把 token_version 加一。"
      x-implemented: local
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                status: { type: integer, enum: [0, 1] }
